<!DOCTYPE html>
<html>
  <head>
    <!-- Ini adalah judul yang akan muncul di tab browser (Google Chrome, Firefox, dll) -->
    <title>Profil Saya ab</title>
    
    <!-- Baris ini menghubungkan file HTML kerangka ini dengan desain dari file style.css -->
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <!-- <div class="kartuprofil"> adalah sebuah wadah/kotak utama untuk mengelompokkan isi profil Anda -->
    <div class="kartuprofil">
      
      <!-- Menampilkan gambar profil. Nanti Anda bisa memasukkan link atau nama file gambar di dalam tanda kutip src="" -->
      <!-- 'alt' adalah teks pengganti yang muncul jika gambar gagal dimuat -->
      <img src="Biodata-RRQ-BB.webp" alt="Foto Profil">
      
      <!-- <h1> adalah teks judul ukuran paling besar -->
      <h1>Hamba Allah</h1>
      
      <!-- <p> adalah paragraf untuk menuliskan teks biasa -->
      <p>Jangan Lupa Sholat Ya Adik Adik</p>
      
      <!-- <a> adalah tautan atau link yang bisa diklik untuk pindah halaman -->
      <a href="https://id.wikipedia.org">sholato rek</a>
      
      <!-- <button> adalah tombol. id="tobat" digunakan sebagai penanda agar bisa digerakkan oleh JavaScript -->
      <button id="tobat">Tobato!</button>
      
    </div>
    
    <!-- Baris ini menghubungkan file HTML dengan file script.js agar tombol bisa berfungsi saat diklik -->
    <script src="script.js"></script>
    
  </body>
</html>
